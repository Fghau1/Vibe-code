# Adwaita darker — ported from ~/.config/kitty/current-theme.conf
# to keep Alacritty visually matching the previous kitty setup.

[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
opacity = 0.7
padding = { x = 10, y = 10 }
decorations = "none"
dynamic_title = true

[font]
size = 11.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }

[terminal]
shell = { program = "zsh" }

[colors.primary]
background = "#000000"
foreground = "#deddda"

[colors.cursor]
text = "#000000"
cursor = "#deddda"

[colors.selection]
text = "#c0bfbc"
background = "#1c1c1c"

[colors.normal]
black = "#000000"
red = "#ed333b"
green = "#57e389"
yellow = "#ff7800"
blue = "#62a0ea"
magenta = "#9141ac"
cyan = "#5bc8af"
white = "#deddda"

[colors.bright]
black = "#9a9996"
red = "#f66151"
green = "#8ff0a4"
yellow = "#ffa348"
blue = "#99c1f1"
magenta = "#dc8add"
cyan = "#93ddc2"
white = "#f6f5f4"
