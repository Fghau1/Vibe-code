background {
    monitor =
    path = screenshot
    color = rgba(0, 0, 0, 1)
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 1.0
    brightness = 0.6
    vibrancy = 0.1
    vibrancy_darkness = 0.2
}

general {
    hide_cursor = false
    grace = 0
    no_fade_in = false
    ignore_empty_input = true
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(85, 85, 85, 1)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 125
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 1)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 15
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 50
    outline_thickness = 1
    dots_center = true
    outer_color = rgba(51, 51, 51, 1)
    inner_color = rgba(0, 0, 0, 0.55)
    font_color = rgb(255, 255, 255)
    check_color = rgba(255, 255, 255, 1)
    fail_color = rgba(255, 95, 95, 1)
    fade_on_empty = false
    rounding = 25
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##555555">password</span>
    position = 0, -50
    halign = center
    valign = center
}
